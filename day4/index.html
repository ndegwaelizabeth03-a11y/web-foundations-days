
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Day 4 - Live Notes</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>
<body>
    <main class="container">
        <h1>Live Notes</h1>
        <p>Write your notes below. Your draft is saved automatically.</p>

        <label for="note-text">Your note</label>
        <textarea
            id="note-text"
            rows="10"
            maxlength="5000"
            placeholder="Start typing your note here..."
        ></textarea>

        <div class="counter-container">
            <p id="char-count">0 / 200 characters</p>
            <p id="word-count">0 words</p>
        </div>

        <p class="hint">Warning at 181 characters. Maximum recommended length: 200.</p>

        <div class="buttons">
            <button id="clear-btn" type="button">Clear note</button>
            <button id="theme-toggle" type="button">Dark mode</button>
        </div>

        <p id="status" aria-live="polite"></p>
    </main>
</body>
</html>
