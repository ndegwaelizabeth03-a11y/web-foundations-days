
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Day 5 - User Directory</title>
    <script src="users.js" defer></script>
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 24px;
            font-family: Arial, sans-serif;
            background: #f4f7fb;
            color: #243047;
        }

        main {
            max-width: 850px;
            margin: 0 auto;
        }

        header, section {
            background: white;
            padding: 24px;
            margin-bottom: 20px;
            border-radius: 12px;
            box-shadow: 0 2px 8px #00000010;
        }

        h1 {
            margin-top: 0;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: bold;
        }

        input, button {
            width: 100%;
            padding: 12px;
            margin-bottom: 12px;
            font: inherit;
            border-radius: 6px;
        }

        input {
            border: 1px solid #b8c2d1;
        }

        button {
            border: none;
            background: #2457a7;
            color: white;
            cursor: pointer;
        }

        button:hover {
            background: #173e7c;
        }

        button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        input:focus-visible, button:focus-visible {
            outline: 3px solid #f0a928;
            outline-offset: 2px;
        }

        #users-list {
            list-style: none;
            padding: 0;
        }

        .user-card {
            border: 1px solid #d9e0eb;
            border-radius: 8px;
            padding: 16px;
            margin-bottom: 12px;
            overflow-wrap: anywhere;
        }

        .user-card h3 {
            margin-top: 0;
        }

        .user-card p {
            margin: 8px 0;
        }

        #status {
            font-weight: bold;
        }

        @media (max-width: 600px) {
            body {
                padding: 12px;
            }

            header, section {
                padding: 16px;
            }
        }
    </style>
</head>
<body>
    <main>
        <header>
            <h1>User Directory</h1>
            <p>Load and search users from the JSONPlaceholder API.</p>
        </header>

        <section aria-labelledby="directory-heading">
            <h2 id="directory-heading">Directory</h2>

            <button type="button" id="load-users">Load Users</button>

            <label for="filter-input">Filter users by name</label>
            <input
                type="text"
                id="filter-input"
                placeholder="Type a name to search..."
            >

            <p id="status" role="status" aria-live="polite">
                Click "Load Users" to begin.
            </p>

            <ul id="users-list"></ul>
        </section>

        <footer>
            <p>Day 5 Assignment - Web Foundations</p>
        </footer>
    </main>
</body>
</html>
